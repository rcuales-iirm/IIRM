<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAM EDU — Education Management CRM (Prototype)</title>
<!--
====================================================================================
CODEX PRODUCTION HANDOFF
====================================================================================
This file is a single-page, self-contained CLICKABLE PROTOTYPE for "TEAM EDU", a
unified education-management CRM. It uses vanilla HTML/CSS/JS only, with an
in-memory JS object graph standing in for a real database. Nothing here talks to a
network, a payment processor, or a server. It is meant to be read top-to-bottom by
an engineer (or Codex) and converted into a real multi-service application. Below
is the recommended production conversion plan.

1) RECOMMENDED COMPONENT BREAKDOWN (frontend)
   - App shell: PublicLayout, AuthLayout (sidebar + topbar), MobileNav
   - Public: Home, Catalog, CourseDetail, ProgramDetail, InstructorProfile,
     HowItWorks, FAQ, Contact, Login, Register, CheckoutDemo, Confirmation,
     CertificateVerify
   - Student: Dashboard, MyCourses, CourseHome, LessonPlayer, Assignments,
     Quizzes, Grades, CourseCommunity (tabs: Feed/Discussions/Members/Events/
     Resources), Calendar, Messages, Notifications, Certificates, CreditHistory,
     Billing, Profile, Support
   - Instructor: MyClasses, ClassDetail (roster/attendance), GradingQueue,
     CommunityManage
   - Admin: Dashboard, Leads, Applications, Students, StudentRecord (tabbed),
     Programs, Courses, CourseBuilder (11-step wizard), Cohorts, Scheduling,
     Instructors, Enrollments, Attendance, Grading, Assessments, Communities,
     Certificates, CreditLedger, Transactions, PaymentPlans, Coupons, Refunds,
     Communications, Automations, Documents, SupportCases, Reports,
     StaffPermissions, AuditLog, Settings
   - Shared: DataTable, Tabs, Modal, Toast, Drawer, StatusPill, EmptyState,
     ConfirmDialog, FormField, FileUpload, CsvExportButton, RoleGate

2) RECOMMENDED API ROUTES (REST, versioned /api/v1)
   Auth:            POST /auth/login, POST /auth/logout, GET /auth/me
   Students:        GET/POST /students, GET/PATCH /students/:id,
                     GET /students/search?email=&phone=  (dedupe lookup),
                     POST /students/:id/merge
   Leads/Apps:       GET/POST /leads, GET/POST /applications, PATCH /applications/:id
   Courses:          GET/POST /courses, GET/PATCH/DELETE /courses/:id,
                     POST /courses/:id/publish
   Programs:         GET/POST /programs
   Cohorts:          GET/POST /cohorts, PATCH /cohorts/:id,
                     POST /cohorts/:id/transfer, POST /cohorts/:id/withdraw
   Enrollments:      GET/POST /enrollments, PATCH /enrollments/:id,
                     POST /enrollments/:id/grant-access
   Progress:         GET/PATCH /enrollments/:id/progress,
                     POST /lessons/:id/complete
   Assignments:      GET/POST /assignments, POST /submissions,
                     PATCH /submissions/:id/grade
   Attendance:       GET/POST /cohorts/:id/sessions,
                     PATCH /sessions/:id/records
   Certificates:     GET/POST /certificates, GET /certificates/verify/:number,
                     POST /certificates/:id/revoke
   CE Ledger:        GET /students/:id/ce-credits
   Commerce:         POST /checkout/session (Stripe Checkout/PaymentIntent),
                     GET /transactions, POST /transactions/:id/refund,
                     GET/POST /coupons, GET/POST /payment-plans
   Communities:      GET /communities/:id, POST /communities/:id/posts,
                     POST /posts/:id/replies, POST /posts/:id/report,
                     GET/POST /communities/:id/events
   Communications:   GET/POST /communications, GET /templates
   Automations:      GET/POST /automations (trigger -> template mapping)
   Support:          GET/POST /support-cases, PATCH /support-cases/:id
   Reports:          GET /reports/:type?filters..., GET /reports/:type/export.csv
   Staff:            GET/POST /staff, GET /roles
   Audit:            GET /audit-log

3) RECOMMENDED DATABASE TABLES (Postgres-style)
   students, leads, applications, staff, roles, role_permissions,
   programs, courses, course_modules, lessons, assessments, assessment_questions,
   completion_rules, cohorts, cohort_sessions, attendance_records,
   enrollments, progress_records, assignments, assignment_submissions,
   certificates, ce_credit_ledger, communities, community_posts,
   community_replies, community_members, community_events, community_resources,
   membership_plans, transactions, payment_plans, payment_plan_installments,
   coupons, refunds, communications, communication_templates, automations,
   documents, support_cases, support_messages, notifications, messages,
   audit_log
   Each domain object (student, course, enrollment, payment, progress,
   community membership, certificate, CE ledger) has exactly ONE table as the
   single source of truth, referenced by foreign key from every module that
   needs it (CRM, learning portal, billing, community) rather than duplicated.

4) RECOMMENDED AUTHENTICATION ROLES (mapped to RBAC claims)
   super_admin, school_admin, registrar, instructor, cohort_leader,
   community_moderator, finance_staff, student_support, student,
   corporate_training_manager, auditor (read-only)
   Enforce with a permissions matrix (module x action) checked server-side on
   every route, not just hidden in the UI (the UI hiding here is for demo only).

5) RECOMMENDED STRIPE WEBHOOK EVENTS
   checkout.session.completed, payment_intent.succeeded,
   payment_intent.payment_failed, charge.refunded, charge.dispute.created,
   invoice.payment_failed (subscriptions/payment plans),
   customer.subscription.deleted (membership expiration)
   Each webhook should be idempotent (store stripe event id) and drive the same
   enrollment workflow simulated in ENROLLMENT WORKFLOW below.

6) RECOMMENDED BACKGROUND JOBS
   - Access-expiration sweep (courses/communities nearing/at expiration)
   - Certificate eligibility check + auto-notify admin queue
   - Communication automation dispatcher (enrollment, reminders, drip)
   - Attendance-threshold risk flagging
   - Payment retry / dunning for failed payments and payment plans
   - Nightly regulatory/CE reporting snapshot

7) RECOMMENDED FILE-STORAGE STRATEGY
   Object storage (e.g., S3-compatible) for lesson videos, downloadable
   resources, student documents, and certificate PDFs, behind signed URLs with
   short expirations; metadata (owner, type, linked entity) stored in
   `documents` table, never storing binary blobs in the primary database.

8) RECOMMENDED AUDIT-LOG STRATEGY
   Append-only `audit_log` table (actor_id, actor_role, action, entity_type,
   entity_id, before/after diff as JSON, ip, timestamp). Every financial,
   enrollment, grading, certificate, and permission change writes an audit
   row in the same transaction as the mutation. Audit log is read-only to all
   roles except super_admin export.

9) RECOMMENDED MIGRATION SEQUENCE
   1. staff/roles/permissions  2. students (+ dedupe indexes on normalized
   email/phone)  3. programs/courses/modules/lessons/assessments  4. cohorts/
   sessions  5. enrollments/progress  6. communities/posts  7. commerce
   (transactions/plans/coupons/refunds)  8. certificates/ce_ledger
   9. communications/automations/support  10. audit_log + reporting views.

10) WHICH INTERACTIONS ARE SIMULATED IN THIS PROTOTYPE
   - Stripe Checkout is a visual simulation only: no network call, no real
     card data collected, outcomes chosen via demo controls (success/fail/
     pending/refunded).
   - All "sent" communications, certificates, CE credits, attendance, and
     audit entries are written to in-memory arrays (`DB.*`) and reset on
     "Reset Demo Data" or a full page reload.
   - Authentication is a role-switcher for demo purposes, not a real login/
     session system.
   - CSV export builds a real CSV Blob and downloads it, but from demo data.
====================================================================================
-->
<style>
/* =====================================================================
   DESIGN SYSTEM — TEAM EDU "Luminous Glass" tokens, reset, typography
   Five-level glass surface hierarchy: background atmosphere, main glass
   panel (.sidebar/.app-topbar), elevated glass card (.card/.course-card/
   .stat-card), dense data surface (.table-wrap/.data-table/form inputs),
   modal surface (.modal). Legacy token names (--navy, --teal, --gold…)
   are kept and aliased to the new palette so every existing render
   function — none of which were touched in this pass — repaints in the
   new system automatically.
   ===================================================================== */
:root{
  /* New TEAM EDU Luminous Glass palette */
  --pearl-white:#f8fbff;
  --ice-blue:#e6f2ff;
  --frosted-blue:#cfe5fb;
  --cyan-glow:#00d1ff;
  --electric-blue:#3b82f6;
  --electric-blue-600:#2563eb;
  --electric-blue-700:#1d4ed8;
  --soft-violet:#a78bfa;
  --chrome-silver:#c6d3df;
  --navy-text:#0f2747;
  --secondary-text:#526d82;
  --success-teal:#10b981;
  --warning-amber:#f4a72c;
  --error-coral:#dc6671;
  --glass-border:rgba(255,255,255,0.78);
  --glass-shadow:rgba(59,130,246,0.13);

  /* Legacy tokens, aliased so existing markup repaints automatically */
  --navy:var(--navy-text);
  --navy-700:#0a1c33;
  --navy-600:var(--electric-blue-600);
  --teal:var(--electric-blue);
  --teal-600:var(--electric-blue-700);
  --teal-100:var(--ice-blue);
  --gold:var(--electric-blue);
  --gold-100:var(--ice-blue);
  --white:#ffffff;
  --ivory:var(--pearl-white);
  --gray-50:var(--pearl-white);
  --gray-100:var(--ice-blue);
  --gray-200:rgba(174,201,225,.55);
  --gray-300:var(--chrome-silver);
  --gray-500:var(--secondary-text);
  --gray-700:var(--navy-text);
  --ink:var(--navy-text);
  --danger:var(--error-coral);
  --danger-100:#fbeaec;
  --success:#0a7d5c;
  --success-100:#e3f8f0;
  --warn:#8a5a12;
  --warn-100:#fdf1de;
  --focus:var(--electric-blue);

  --radius-sm:12px;
  --radius-md:20px;
  --radius-lg:24px;
  --shadow-sm:0 10px 28px rgba(50,91,126,.08);
  --shadow-md:0 16px 38px rgba(62,116,164,.13);
  --shadow-lg:0 22px 55px rgba(59,130,246,.16);
  --maxw:1240px;
  --font: Inter, "Plus Jakarta Sans", Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  font-family:var(--font);
  font-size:16px;
  line-height:1.55;
  color:var(--navy-text);
  background:
    radial-gradient(circle at 16% 8%, rgba(0,209,255,.13), transparent 28%),
    radial-gradient(circle at 87% 12%, rgba(167,139,250,.12), transparent 24%),
    radial-gradient(circle at 80% 82%, rgba(59,130,246,.10), transparent 30%),
    linear-gradient(145deg, #fafdff 0%, #edf7ff 48%, #f8fbff 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
@media (max-width:640px){ body{ background-attachment:scroll; } }
h1,h2,h3,h4,h5{font-weight:700;color:var(--navy-text);margin:0 0 .5em;line-height:1.25;letter-spacing:-.01em;}
h1{font-size:clamp(1.75rem,3.2vw,2.5rem);font-weight:650;}
h2{font-size:clamp(1.4rem,2.4vw,1.85rem);font-weight:650;}
h3{font-size:1.25rem;font-weight:650;}
h4{font-size:1.05rem;font-weight:650;}
p{margin:0 0 1em;}
a{color:var(--electric-blue-700);text-decoration:none;}
a:hover{text-decoration:underline;}
ul,ol{margin:0 0 1em;padding-left:1.3em;}
img{max-width:100%;display:block;}
button{font-family:inherit;}
table{border-collapse:collapse;width:100%;}
:focus-visible{outline:3px solid var(--electric-blue);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
/* Opaque fallback wherever backdrop-filter (or reduced-transparency) is not honored */
@media (prefers-reduced-transparency: reduce){
  .card,.stat-card,.course-card,.sidebar,.app-topbar,.modal,.course-outline,
  .community-feed .post,.mobile-drawer .panel,.certificate{
    background:#fbfdff !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
  }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .card,.stat-card,.course-card,.sidebar,.app-topbar,.modal,.course-outline,
  .community-feed .post,.mobile-drawer .panel{ background:#fbfdff; }
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.skip-link{position:absolute;left:-999px;top:0;background:linear-gradient(135deg,#43ddf4,var(--electric-blue));color:#fff;padding:.75em 1em;z-index:2000;border-radius:0 0 12px 0;}
.skip-link:focus{left:0;}

/* Chrome / acrylic edge highlight, applied to major glass surfaces */
.card,.stat-card,.course-card,.modal,.course-outline{position:relative;}
.card::before,.stat-card::before,.course-card::before,.modal::before,.course-outline::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg, rgba(255,255,255,.6), transparent 28%, transparent 72%, rgba(133,133,255,.10));
}

/* Layout helpers */
.container{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
.flex{display:flex;}
.flex-col{display:flex;flex-direction:column;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.gap-xs{gap:8px;}
.gap-sm{gap:12px;}
.gap-md{gap:20px;}
.gap-lg{gap:32px;}
.grid{display:grid;gap:20px;}
.grid > *{min-width:0;}
.card{min-width:0;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
.mt-0{margin-top:0;}
.mt-sm{margin-top:12px;}
.mt-md{margin-top:20px;}
.mt-lg{margin-top:32px;}
.mb-0{margin-bottom:0;}
.muted{color:var(--gray-500);}
.small{font-size:.875rem;}
.text-right{text-align:right;}
.nowrap{white-space:nowrap;}
.hidden{display:none !important;}
.w-full{width:100%;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:.65em 1.3em;border-radius:var(--radius-sm);font-size:1rem;font-weight:600;
  border:1.5px solid transparent;cursor:pointer;transition:background .2s,color .2s,border-color .2s,box-shadow .2s,transform .08s;
  min-height:44px;line-height:1.2;
}
.btn:active{transform:translateY(1px);}
.btn-primary,.btn-gold{
  background:linear-gradient(135deg,#43ddf4,var(--electric-blue));color:#fff;
  border:1px solid rgba(255,255,255,.68);
  box-shadow:0 10px 24px rgba(59,130,246,.23), inset 0 1px 0 rgba(255,255,255,.68);
}
.btn-primary:hover,.btn-gold:hover{background:linear-gradient(135deg,#2bc9ec,var(--electric-blue-600));box-shadow:0 12px 28px rgba(59,130,246,.30), inset 0 1px 0 rgba(255,255,255,.7);}
.btn-teal{background:linear-gradient(135deg,var(--soft-violet),var(--electric-blue));color:#fff;border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 22px rgba(124,109,240,.24), inset 0 1px 0 rgba(255,255,255,.6);}
.btn-teal:hover{filter:brightness(1.06);}
.btn-outline{background:rgba(255,255,255,.55);border-color:rgba(59,130,246,.4);color:var(--navy-text);backdrop-filter:blur(8px);}
.btn-outline:hover{background:rgba(0,209,255,.12);border-color:var(--electric-blue);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--electric-blue-700);}
.btn-ghost:hover{background:rgba(0,209,255,.10);}
.btn-danger{background:rgba(255,255,255,.6);border-color:var(--error-coral);color:#a3374a;}
.btn-danger:hover{background:var(--error-coral);color:#fff;}
.btn-sm{padding:.4em .9em;font-size:.875rem;min-height:36px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-block{width:100%;}
.icon-btn{background:rgba(255,255,255,.55);border:1px solid rgba(174,201,225,.55);border-radius:12px;min-height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy-text);transition:background .18s;}
.icon-btn:hover{background:rgba(0,209,255,.12);}
.link-btn{background:none;border:none;color:var(--electric-blue-700);cursor:pointer;font:inherit;padding:0;text-decoration:underline;}

/* Badges / status pills — never color alone: always include icon glyph + text */
.pill{display:inline-flex;align-items:center;gap:6px;padding:.3em .75em;border-radius:999px;font-size:.8rem;font-weight:700;border:1px solid transparent;}
.pill-success{background:rgba(16,185,129,.12);color:var(--success);border-color:rgba(16,185,129,.3);}
.pill-danger{background:rgba(220,102,113,.12);color:#a3374a;border-color:rgba(220,102,113,.32);}
.pill-warn{background:rgba(244,167,44,.14);color:var(--warn);border-color:rgba(244,167,44,.35);}
.pill-info{background:rgba(59,130,246,.10);color:var(--electric-blue-700);border-color:rgba(59,130,246,.3);}
.pill-neutral{background:rgba(198,211,223,.28);color:var(--secondary-text);border-color:rgba(174,201,225,.55);}
.pill-gold{background:rgba(167,139,250,.14);color:#6d4fc9;border-color:rgba(167,139,250,.35);}

/* Cards — Elevated Glass Card */
.card{
  background:linear-gradient(145deg, rgba(255,255,255,.85), rgba(232,245,255,.68));
  backdrop-filter:blur(28px) saturate(145%);-webkit-backdrop-filter:blur(28px) saturate(145%);
  border:1px solid rgba(255,255,255,.88);
  box-shadow:0 16px 38px rgba(62,116,164,.13), inset 0 1px 0 rgba(255,255,255,.96);
  border-radius:var(--radius-md);padding:20px;
}
.card-hover{transition:box-shadow .22s,transform .22s;}
.card-hover:hover{box-shadow:0 22px 48px rgba(62,116,164,.20), inset 0 1px 0 rgba(255,255,255,.96);transform:translateY(-3px);}
.stat-card{
  background:linear-gradient(145deg, rgba(255,255,255,.85), rgba(232,245,255,.62));
  backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);
  border:1px solid rgba(255,255,255,.86);
  box-shadow:0 14px 32px rgba(62,116,164,.12), inset 0 1px 0 rgba(255,255,255,.94);
  border-radius:18px;padding:18px 20px;transition:box-shadow .22s,transform .22s;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(62,116,164,.18), inset 0 1px 0 rgba(255,255,255,.94);}
.stat-card .stat-value{font-size:1.8rem;font-weight:750;color:var(--navy-text);}
.stat-card .stat-label{color:var(--secondary-text);font-size:.82rem;font-weight:650;text-transform:uppercase;letter-spacing:.04em;}
.stat-card button.stat-link{margin-top:6px;}

/* Forms — sit on higher-opacity surfaces than decorative glass */
label{display:block;font-weight:650;font-size:.9rem;margin-bottom:6px;color:var(--navy-text);}
.field{margin-bottom:18px;}
.field .hint{font-size:.8rem;color:var(--secondary-text);margin-top:4px;}
.field .error-msg{font-size:.8rem;color:#a3374a;margin-top:4px;font-weight:650;}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;padding:.7em .8em;border:1.5px solid rgba(174,201,225,.65);border-radius:10px;font-size:1rem;font-family:inherit;
  background:rgba(255,255,255,.88);color:var(--navy-text);transition:border-color .18s,box-shadow .18s;
}
input::placeholder,textarea::placeholder{color:#8ea2b5;}
input:focus,select:focus,textarea:focus{border-color:var(--electric-blue);box-shadow:0 0 0 3px rgba(59,130,246,.18);outline:none;}
textarea{resize:vertical;min-height:90px;}
input:invalid.touched,.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--error-coral);background:rgba(220,102,113,.06);}
.checkbox-row{display:flex;align-items:flex-start;gap:10px;}
.checkbox-row input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--electric-blue);}
fieldset{border:1px solid rgba(174,201,225,.5);border-radius:14px;padding:16px;margin:0 0 18px;}
legend{font-weight:700;color:var(--navy-text);padding:0 6px;}

/* Tables — Dense Data Surface: high opacity, minimal blur, strong readability */
.table-wrap{overflow-x:auto;border:1px solid rgba(174,201,225,.55);border-radius:18px;background:rgba(252,254,255,.94);box-shadow:0 10px 28px rgba(50,91,126,.08);}
table.data-table{min-width:640px;}
.data-table th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--secondary-text);background:rgba(230,242,255,.55);padding:12px 14px;border-bottom:2px solid rgba(174,201,225,.4);position:sticky;top:0;}
.data-table td{padding:12px 14px;border-bottom:1px solid rgba(174,201,225,.25);font-size:.95rem;vertical-align:middle;color:var(--navy-text);}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:rgba(0,209,255,.06);}
.table-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;}
.table-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.table-filters select,.table-filters input{width:auto;min-width:150px;}
.empty-state{text-align:center;padding:48px 20px;color:var(--secondary-text);}
.empty-state .icon{font-size:2rem;margin-bottom:8px;}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid rgba(174,201,225,.4);overflow-x:auto;margin-bottom:20px;}
.tab-btn{background:none;border:none;padding:12px 16px;font-weight:700;color:var(--secondary-text);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-size:.95rem;transition:color .18s;}
.tab-btn:hover{color:var(--navy-text);}
.tab-btn[aria-selected="true"]{color:var(--electric-blue-700);border-bottom-color:var(--electric-blue);}

/* Modal — Modal Surface: near-opaque, strong shadow, clear focus separation */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,39,71,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;animation:modalFade .2s ease;}
@keyframes modalFade{from{opacity:0;}to{opacity:1;}}
.modal{
  background:rgba(252,254,255,.98);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
  border:1px solid rgba(255,255,255,.9);border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:0 30px 80px rgba(15,39,71,.28);
}
.modal.modal-lg{max-width:800px;}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px;border-bottom:1px solid rgba(174,201,225,.4);position:sticky;top:0;background:rgba(252,254,255,.98);}
.modal-body{padding:24px;}

<script>

/* =====================================================================
   SECTION: UTILITY FUNCTIONS
   ===================================================================== */
const Util = {
  uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); },
  fmtMoney(n){ return '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); },
  fmtDate(d){ if(!d) return '—'; const dt = (d instanceof Date)?d:new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); },
  fmtDateTime(d){ const dt=(d instanceof Date)?d:new Date(d); if(isNaN(dt)) return d; return dt.toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); },
  daysUntil(d){ const dt=new Date(d); const now=new Date(); return Math.ceil((dt-now)/(1000*60*60*24)); },
  normalizeEmail(e){ return (e||'').trim().toLowerCase(); },
  normalizePhone(p){ return (p||'').replace(/\D/g,''); },
  escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  initials(name){ if(!name) return '?'; return name.split(' ').filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join(''); },
  qs(id){ return document.getElementById(id); },
  clamp(n,min,max){ return Math.max(min,Math.min(max,n)); },
  downloadCsv(filename, rows){
    const csv = rows.map(r=>r.map(cell=>{
      const s = (cell==null?'':String(cell));
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',')).join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }
};

/* =====================================================================
   SECTION: TOAST + MODAL ENGINE
   ===================================================================== */
const Toast = {
  show(kind, title, body){
    const root = Util.qs('toast-root');
    const el = document.createElement('div');
    el.className = 'toast toast-' + kind;
    el.setAttribute('role','status');
    const glyph = kind==='success' ? '✓' : kind==='error' ? '⚠' : kind==='warn' ? '!' : 'ℹ';
    el.innerHTML = '<div aria-hidden="true">'+glyph+'</div><div><strong>'+Util.escapeHtml(title)+'</strong>'+(body?('<div>'+Util.escapeHtml(body)+'</div>'):'')+'</div><button class="toast-close" data-action="dismissToast" aria-label="Dismiss notification">&times;</button>';
    root.appendChild(el);
    const timer = setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 5200);
    el.querySelector('.toast-close').addEventListener('click', ()=>{ clearTimeout(timer); if(el.parentNode) el.parentNode.removeChild(el); });
  }
};

const Modal = {
  open(html, opts){
    opts = opts || {};
    const root = Util.qs('modal-root');
    root.innerHTML = '<div class="modal-backdrop" data-action="modalBackdrop"><div class="modal '+(opts.large?'modal-lg':'')+'" role="dialog" aria-modal="true" aria-label="'+Util.escapeHtml(opts.label||'Dialog')+'">'+html+'</div></div>';
    const backdrop = root.querySelector('.modal-backdrop');
    backdrop.addEventListener('click', function(e){ if(e.target === backdrop) Modal.close(); });
    const firstFocusable = root.querySelector('button, input, select, textarea, a[href]');
    if(firstFocusable) firstFocusable.focus();
    document.addEventListener('keydown', Modal._escHandler);
  },
  _escHandler(e){ if(e.key === 'Escape') Modal.close(); },
  close(){
    Util.qs('modal-root').innerHTML = '';
    document.removeEventListener('keydown', Modal._escHandler);
  },
  confirm(title, body, confirmLabel, onConfirm, danger){
    const html = '<div class="modal-header"><h3 style="margin:0">'+Util.escapeHtml(title)+'</h3><button class="icon-btn" data-action="closeModal" aria-label="Close dialog">&times;</button></div>'+
      '<div class="modal-body"><p>'+Util.escapeHtml(body)+'</p></div>'+
      '<div class="modal-footer"><button class="btn btn-ghost" data-action="closeModal">Cancel</button><button class="btn '+(danger?'btn-danger':'btn-primary')+'" id="modal-confirm-btn">'+Util.escapeHtml(confirmLabel)+'</button></div>';
    Modal.open(html, {label:title});
    Util.qs('modal-confirm-btn').addEventListener('click', function(){ Modal.close(); onConfirm(); });
  }
};

/* =====================================================================
   SECTION: ROUTER
   Hash-based router. Every real destination in the app is a distinct
   #/... hash (never a bare "#"), so back/forward and deep-linking work.
   ===================================================================== */
function parseHash(){
  let h = window.location.hash.replace(/^#\/?/, '');
  if(!h) h = 'home';
  const parts = h.split('/');
  const page = parts[0];
  const params = parts.slice(1);
  return {page, params};
}
function navigate(hash){
  if(window.location.hash === '#/'+hash){ render(); return; }
  window.location.hash = '#/'+hash;
}
window.addEventListener('hashchange', function(){
  STATE.ui.mobileNavOpen = false; STATE.ui.sidebarOpen = false;
  render();
  const main = Util.qs('main-content');
  if(main) main.focus();
  window.scrollTo(0,0);
});

/* Renderers is populated across the rest of this file: Renderers['home'] = fn(params){ return htmlString } */
const Renderers = {};

function render(){
  STATE.route = parseHash();
  const root = Util.qs('app-root');
  const def = STATE.session.loggedIn ? ROLE_DEFS[STATE.session.role] : null;
  const active = document.activeElement;
  const restoreFocus = (active && active.id) ? {id:active.id, selStart:active.selectionStart, selEnd:active.selectionEnd} : null;
  let html;
  try{
    if(!def || def.layout === 'public'){
      html = renderPublicShell(STATE.route);
    } else if(def.layout === 'student'){
      html = renderAppShell(STATE.route, 'student');
    } else if(def.layout === 'instructor'){
      html = renderAppShell(STATE.route, 'instructor');
    } else {
      html = renderAppShell(STATE.route, 'admin');
    }
  }catch(err){
    console.error(err);
    html = '<div class="container section"><div class="banner banner-danger"><strong>Something went wrong rendering this view.</strong></div></div>';
  }
  root.innerHTML = html;
  if(restoreFocus){
    const el = Util.qs(restoreFocus.id);
    if(el){ el.focus(); if(typeof restoreFocus.selStart === 'number' && el.setSelectionRange){ try{ el.setSelectionRange(restoreFocus.selStart, restoreFocus.selEnd); }catch(e){} } }
  }
  afterRender();
}

function DataTable(opts){
  // opts: {columns:[{key,label}], rows:[...], rowKey, emptyMessage, renderCell(col,row)}
  if(!opts.rows.length){
    return '<div class="table-wrap">'+EmptyState(opts.emptyMessage || 'No records match your filters.')+'</div>';
  }
  const thead = '<tr>'+opts.columns.map(function(c){ return '<th>'+c.label+'</th>'; }).join('')+'</tr>';
  const rows = opts.rows.map(function(row){
    const cells = opts.columns.map(function(c){
      const val = opts.renderCell ? opts.renderCell(c, row) : Util.escapeHtml(row[c.key]);
      return '<td>'+val+'</td>';
    }).join('');
    return '<tr>'+cells+'</tr>';
  }).join('');
  return '<div class="table-wrap"><table class="data-table"><thead>'+thead+'</thead><tbody>'+rows+'</tbody></table></div>';
}

function Tabs(groupKey, tabs, activeKeyDefault){
  if(!STATE.ui.activeTabs[groupKey]) STATE.ui.activeTabs[groupKey] = activeKeyDefault || tabs[0].key;
  const active = STATE.ui.activeTabs[groupKey];
  const nav = '<div class="tabs" role="tablist">'+tabs.map(function(t){
    return '<button class="tab-btn" role="tab" aria-selected="'+(t.key===active)+'" data-action="switchTab" data-group="'+groupKey+'" data-tab="'+t.key+'">'+t.label+'</button>';
  }).join('')+'</div>';
  const activeTab = tabs.find(function(t){ return t.key === active; }) || tabs[0];
  return nav + '<div role="tabpanel">' + activeTab.render() + '</div>';
}

/* =====================================================================
   SECTION: FORM VALIDATION
   ===================================================================== */
function validateRequired(form, fieldNames){
  let ok = true;
  fieldNames.forEach(function(name){
    const input = form.querySelector('[name="'+name+'"]');
    if(!input) return;
    const field = input.closest('.field') || input.parentElement;
    const isCheck = input.type === 'checkbox';
    const val = isCheck ? input.checked : input.value.trim();
    const invalid = !val;
    field.classList.toggle('invalid', invalid);
    let err = field.querySelector('.error-msg');
    if(invalid){
      ok = false;
      if(!err){ err = document.createElement('div'); err.className = 'error-msg'; field.appendChild(err); }
      err.textContent = isCheck ? 'You must check this box to continue.' : 'This field is required.';
    } else if(err){ err.textContent = ''; }
  });
  if(!ok){
    const firstInvalid = form.querySelector('.field.invalid input, .field.invalid select, .field.invalid textarea');
    if(firstInvalid) firstInvalid.focus();
    Toast.show('error','Please complete required fields','Some information is missing or incomplete.');
  }
  return ok;
}
function validateEmail(form, fieldName){
  const input = form.querySelector('[name="'+fieldName+'"]');
  if(!input) return true;
  const field = input.closest('.field') || input.parentElement;
  const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value.trim());
  field.classList.toggle('invalid', !ok);
  let err = field.querySelector('.error-msg');
  if(!ok){
    if(!err){ err = document.createElement('div'); err.className='error-msg'; field.appendChild(err); }
    err.textContent = 'Enter a valid email address.';
  } else if(err){ err.textContent=''; }
  return ok;
}

/* =====================================================================
   SECTION: EVENT DELEGATION (ACTIONS REGISTRY)
   Every button/link/form in this prototype dispatches through here via
   data-action attributes, rather than scattering addEventListener calls
   across render functions. Feature sections below extend `Actions` with
   Object.assign as they are defined.
   ===================================================================== */
const Actions = {
  toggleMobileNav: function(){ STATE.ui.mobileNavOpen = !STATE.ui.mobileNavOpen; render(); },
  toggleSidebar: function(){ STATE.ui.sidebarOpen = !STATE.ui.sidebarOpen; render(); },
  closeModal: function(){ Modal.close(); },
  modalBackdrop: function(){ /* handled by backdrop click listener */ },
  dismissToast: function(){ /* handled inline in Toast.show */ },
  switchTab: function(el){
    STATE.ui.activeTabs[el.getAttribute('data-group')] = el.getAttribute('data-tab');
    render();
  },
  switchRole: function(el){
    const role = el.value;
    const def = ROLE_DEFS[role];
    STATE.session.role = role;
    STATE.session.roleLabel = def.label;
    STATE.session.instructorId = null;
    if(role === 'student'){
      STATE.session.studentId = DB.demoStudentId;
      STATE.session.name = DB.students.find(function(s){ return s.id===DB.demoStudentId; }).firstName + ' ' + DB.students.find(function(s){ return s.id===DB.demoStudentId; }).lastName;
      navigate('dashboard');
    } else if(role === 'instructor' || role === 'cohort_leader'){
      const inst = Q.instructor(role==='instructor' ? 'i1' : 'i2');
      STATE.session.instructorId = inst.id; STATE.session.name = inst.name; STATE.session.studentId = null;
      navigate('classes');
    } else {
      const staffMatch = DB.staff.find(function(s){ return s.role === role; });
      STATE.session.name = staffMatch ? staffMatch.name : def.label + ' (Demo)';
      STATE.session.studentId = null;
      navigate('dashboard');
    }
    Toast.show('info','Switched role', 'You are now viewing TEAM EDU as: ' + def.label + '.');
  },
  logout: function(){
    STATE.session = { loggedIn:false, role:null, roleLabel:null, name:null, studentId:null, staffId:null };
    navigate('home');
    Toast.show('info','Signed out','You have been signed out of the demo session.');
  },
  resetDemoData: function(){
    Modal.confirm('Reset demo data?', 'This restores every student, course, payment, and community record to its original demonstration state. Anything you changed this session will be lost.', 'Reset Demo Data', function(){
      const fresh = JSON.parse(JSON.stringify(DB_SNAPSHOT));
      Object.keys(DB).forEach(function(k){ delete DB[k]; });
      Object.keys(fresh).forEach(function(k){ DB[k] = fresh[k]; });
      STATE.filters = {}; STATE.ui.activeTabs = {};
      render();
      Toast.show('success','Demo data reset','All records have been restored to their original state.');
    }, true);
  }
};

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');
  if(Actions[action]){ e.preventDefault(); Actions[action](el, e); }
});
document.addEventListener('submit', function(e){
  const form = e.target.closest('form[data-action]');
  if(!form) return;
  e.preventDefault();
  const action = form.getAttribute('data-action');
  if(Actions[action]) Actions[action](form, e);
});
document.addEventListener('change', function(e){
  const el = e.target.closest('[data-onchange]');
  if(!el) return;
  const action = el.getAttribute('data-onchange');
  if(Actions[action]) Actions[action](el, e);
});
document.addEventListener('input', function(e){
  const el = e.target.closest('[data-oninput]');
  if(!el) return;
  const action = el.getAttribute('data-oninput');
  if(Actions[action]) Actions[action](el, e);
});

/* =====================================================================
   SECTION: DOMAIN HELPERS
   Read helpers over DB. In production these become API calls / SQL
   queries; here they are simple array lookups over the single in-memory
   source of truth for each entity.
   ===================================================================== */
const Q = {
  course: function(id){ return DB.courses.find(function(c){ return c.id===id; }); },
  instructor: function(id){ return DB.instructors.find(function(i){ return i.id===id; }); },
  program: function(id){ return DB.programs.find(function(p){ return p.id===id; }); },
  cohort: function(id){ return DB.cohorts.find(function(c){ return c.id===id; }); },
  cohortsForCourse: function(courseId){ return DB.cohorts.filter(function(c){ return c.courseId===courseId; }); },
  community: function(id){ return DB.communities.find(function(c){ return c.id===id; }); },
  student: function(id){ return DB.students.find(function(s){ return s.id===id; }); },
  staffMember: function(id){ return DB.staff.find(function(s){ return s.id===id; }); },
  enrollment: function(id){ return DB.enrollments.find(function(e){ return e.id===id; }); },
  enrollmentsForStudent: function(sid){ return DB.enrollments.filter(function(e){ return e.studentId===sid; }); },
  enrollmentsForCourse: function(cid){ return DB.enrollments.filter(function(e){ return e.courseId===cid; }); },
  transactionsForStudent: function(sid){ return DB.transactions.filter(function(t){ return t.studentId===sid; }); },
  certificatesForStudent: function(sid){ return DB.certificates.filter(function(c){ return c.studentId===sid; }); },
  ceForStudent: function(sid){ return DB.ceLedger.filter(function(c){ return c.studentId===sid; }); },
  communicationsForStudent: function(sid){ return DB.communications.filter(function(c){ return c.studentId===sid; }); },
  documentsForStudent: function(sid){ return DB.documents.filter(function(d){ return d.studentId===sid; }); },
  supportForStudent: function(sid){ return DB.supportCases.filter(function(c){ return c.studentId===sid; }); },
  postsForCommunity: function(cid){ return DB.communityPosts.filter(function(p){ return p.communityId===cid; }); },
  eventsForCommunity: function(cid){ return DB.communityEvents.filter(function(e){ return e.communityId===cid; }); },
  resourcesForCommunity: function(cid){ return DB.communityResources.filter(function(r){ return r.communityId===cid; }); },
  membersForCommunity: function(communityId, courseId){
    const ens = DB.enrollments.filter(function(e){ return e.courseId===courseId; });
    return ens.map(function(e){ return Q.student(e.studentId); }).filter(Boolean);
  },
  courseName: function(id){ const c=Q.course(id); return c ? c.title : 'Unknown Course'; },
  studentName: function(id){ const s=Q.student(id); return s ? (s.firstName+' '+s.lastName) : 'Unknown Student'; },
  instructorName: function(id){ const i=Q.instructor(id); return i ? i.name : 'Unassigned'; },
  seatsRemaining: function(cohort){ const used = DB.enrollments.filter(function(e){ return e.cohortId===cohort.id && e.status!=='withdrawn'; }).length; return Math.max(0, cohort.capacity-used); },
  currentStudent: function(){ return STATE.session.studentId ? Q.student(STATE.session.studentId) : null; },
  findDuplicate: function(email, phone){
    const ne = Util.normalizeEmail(email), np = Util.normalizePhone(phone);
    return DB.students.find(function(s){ return Util.normalizeEmail(s.email)===ne || (np && Util.normalizePhone(s.phone)===np); });
  },
  deliveryLabel: function(m){ return {'self-paced':'Self-Paced Online','live-online':'Live Online','in-person':'In-Person','hybrid':'Hybrid'}[m] || m; },
  currentInstructor: function(){ return STATE.session.instructorId ? Q.instructor(STATE.session.instructorId) : null; },
  cohortsForInstructor: function(instructorId){ return DB.cohorts.filter(function(c){ return c.instructorId===instructorId; }); },
  applicationsForStudent: function(sid){ return DB.applications.filter(function(a){ return a.studentId===sid; }); },
  notesForStudent: function(sid){ return DB.studentNotes.filter(function(n){ return n.studentId===sid; }); },
  submissionsForStudent: function(sid){ return DB.submissions.filter(function(s){ return s.studentId===sid; }); },
  attendanceForStudent: function(sid){
    const out = [];
    DB.attendanceSessions.forEach(function(sess){ if(sess.records[sid]) out.push({date:sess.date, topic:sess.topic, status:sess.records[sid], cohortId:sess.cohortId}); });
    return out;
  },
  auditForStudent: function(sid){ return DB.auditLog.filter(function(a){ return a.entity.indexOf(sid)>-1; }); },
  communitiesForStudent: function(sid){
    const ens = Q.enrollmentsForStudent(sid);
    return ens.map(function(e){ return Q.community(Q.course(e.courseId).communityId); }).filter(Boolean);
  },
  findDuplicatePairs: function(){
    const pairs = []; const seen = new Set();
    DB.students.forEach(function(a){
      DB.students.forEach(function(b){
        if(a.id>=b.id) return;
        const key = a.id+'|'+b.id;
        if(seen.has(key)) return;
        const emailMatch = Util.normalizeEmail(a.email) && Util.normalizeEmail(a.email)===Util.normalizeEmail(b.email);
        const phoneMatch = Util.normalizePhone(a.phone) && Util.normalizePhone(a.phone)===Util.normalizePhone(b.phone);
        if(emailMatch || phoneMatch){ pairs.push([a,b]); seen.add(key); }
      });
    });
    return pairs;
  }
};

/* =====================================================================
   SECTION: ENROLLMENT WORKFLOW ENGINE + PAYMENT SIMULATION
   Mirrors the required Stripe-checkout-to-dashboard workflow:
   1) search existing student  2) create/update student  3) create
   transaction  4) create enrollment  5) grant access  6) attach cohort
   7) attach community (derived from enrollment, not a separate table)
   8) welcome notification  9) audit log  10) route to dashboard.
   ===================================================================== */
const PaymentSim = {
  simulate: function(scenario){
    if(scenario==='success') return {status:'succeeded'};
    if(scenario==='failed') return {status:'failed'};
    if(scenario==='pending') return {status:'pending'};
    if(scenario==='refunded') return {status:'refunded'};
    return {status:'succeeded'};
  }
};

const EnrollmentEngine = {
  enroll: function(info){
    // info: {firstName,lastName,email,phone,licenseType,courseId,cohortId,amount,couponCode,paymentPlanId,scenario}
    const course = Q.course(info.courseId);
    const cohort = Q.cohort(info.cohortId);
    // Step 1: search for existing student
    let student = Q.findDuplicate(info.email, info.phone);
    // Step 2: create or update student record (single source of truth)
    if(student){
      student.firstName = info.firstName || student.firstName;
      student.lastName = info.lastName || student.lastName;
      student.phone = info.phone || student.phone;
      if(student.status==='prospect') student.status = 'active';
    } else {
      student = {id:Util.uid('s'), firstName:info.firstName, lastName:info.lastName, email:info.email, phone:info.phone, licenseType:info.licenseType||'Real Estate Sales Associate', status:'active', assignedStaff:'st3', riskFlag:false, createdAt:new Date().toISOString().slice(0,10), address:'', dob:''};
      DB.students.push(student);
    }
    const payment = PaymentSim.simulate(info.scenario);
    // Step 3: create transaction (always recorded, regardless of outcome)
    const tx = {id:Util.uid('tx'), studentId:student.id, courseId:course.id, amount:info.amount, status:payment.status, method: info.paymentPlanId ? 'Payment Plan — Demo Card' : 'Visa •••• 4242 (demo)', date:new Date().toISOString().slice(0,10), couponCode:info.couponCode||null, paymentPlanId:info.paymentPlanId||null, notes: payment.status==='failed' ? 'Card declined — insufficient funds (demo).' : (payment.status==='pending' ? 'Awaiting bank confirmation (demo).' : (payment.status==='refunded' ? 'Refunded transaction (demo).' : '')) };
    DB.transactions.unshift(tx);
    DB.auditLog.unshift({id:Util.uid('aud'), date:new Date().toISOString(), actor:'System (Checkout Demo)', action:'Payment '+payment.status, entity:'Transaction '+tx.id+' / Student '+student.id, details:course.title+' — '+Util.fmtMoney(info.amount)});

    let enrollment = null;
    if(payment.status === 'succeeded'){
      // Step 4/5/6: create enrollment, grant access, attach cohort
      const existing = DB.enrollments.find(function(e){ return e.studentId===student.id && e.courseId===course.id && e.status!=='withdrawn'; });
      if(existing){
        enrollment = existing;
      } else {
        const expires = new Date(); expires.setFullYear(expires.getFullYear()+1);
        enrollment = {id:Util.uid('en'), studentId:student.id, courseId:course.id, cohortId:cohort?cohort.id:null, status:'active', progressPct:0, enrolledAt:new Date().toISOString().slice(0,10), accessExpiresAt:expires.toISOString().slice(0,10), completionDate:null};
        DB.enrollments.push(enrollment);
        const firstLesson = course.curriculum[0].lessons[0].id;
        const progressMap = {}; course.curriculum.forEach(function(m){ m.lessons.forEach(function(l,idx){ progressMap[l.id] = (m===course.curriculum[0] && idx===0) ? 'available' : 'locked'; }); });
        DB.lessonProgress[enrollment.id] = progressMap;
      }
      // Step 7: community membership is DERIVED from the enrollment record above —
      // no separate community-membership table is created, preserving one source of truth.
      // Step 8: welcome notification
      DB.notifications.unshift({id:Util.uid('nt'), studentId:student.id, title:'Welcome to '+course.title, body:'Your enrollment is confirmed. Jump in with the first lesson from My Courses.', date:new Date().toISOString().slice(0,10), read:false, type:'enrollment'});
      DB.communications.unshift({id:Util.uid('comm'), studentId:student.id, template:'Enrollment Confirmed', subject:'You\'re enrolled: '+course.title, date:new Date().toISOString().slice(0,10), channel:'email'});
      DB.communications.unshift({id:Util.uid('comm'), studentId:student.id, template:'Payment Receipt', subject:'Receipt for your TEAM EDU purchase', date:new Date().toISOString().slice(0,10), channel:'email'});
      // Step 9: audit log
      DB.auditLog.unshift({id:Util.uid('aud'), date:new Date().toISOString(), actor:'System (Checkout Demo)', action:'Enrollment created', entity:'Enrollment '+enrollment.id+' / Student '+student.id, details:'Course: '+course.title});
    }
    return {student:student, transaction:tx, enrollment:enrollment, payment:payment};
  }
};

    if(!ck.firstName || !ck.lastName || !ck.email || !ck.phone){ Toast.show('error','Missing information','Enter your name, email, and phone to continue.'); return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ck.email)){ Toast.show('error','Invalid email','Enter a valid email address.'); return; }
    const course = Q.course(ck.courseId);
    const plan = DB.paymentPlans.find(function(p){ return p.courseId===ck.courseId; });
    const dup = Q.findDuplicate(ck.email, ck.phone);
    const alreadyEnrolled = dup ? DB.enrollments.find(function(e){ return e.studentId===dup.id && e.courseId===ck.courseId && e.status!=='withdrawn'; }) : null;
    if(alreadyEnrolled){
      STATE.session = {loggedIn:true, role:'student', roleLabel:'Student', name:dup.firstName+' '+dup.lastName, studentId:dup.id, staffId:null};
      navigate('dashboard');

    const total = Math.max(0, Math.round((course.price-discount)*100)/100);
    const amount = (ck.paymentOption==='plan' && plan) ? plan.amountPerInstallment : total;
    const result = EnrollmentEngine.enroll({
      firstName:ck.firstName, lastName:ck.lastName, email:ck.email, phone:ck.phone,
      courseId:ck.courseId, cohortId:ck.cohortId, amount:amount, couponCode: ck.couponApplied?ck.couponApplied.code:null,
      paymentPlanId: (ck.paymentOption==='plan'&&plan)?plan.id:null, scenario:ck.scenario
    });
    ck.outcome = result.payment;
    render();
    if(result.payment.status==='succeeded'){
      STATE.session = {loggedIn:true, role:'student', roleLabel:'Student', name:result.student.firstName+' '+result.student.lastName, studentId:result.student.id, staffId:null};
      setTimeout(function(){ navigate('confirmation/'+result.enrollment.id); }, 700);
    } else if(result.payment.status==='failed'){
      Toast.show('error','Payment declined (demo)','Try a different simulated outcome, or continue browsing.');
    } else if(result.payment.status==='pending'){
      Toast.show('warn','Payment pending (demo)','We\'ll email you once this clears — no access has been granted yet.');
    } else if(result.payment.status==='refunded'){
      Toast.show('info','Refunded transaction (demo)','This receipt shows as refunded — no course access was granted.');
    }
  }
});

  {q:'Where is the minimum passing score for this course defined?', options:['It is never disclosed','60% for every TEAM EDU course','As configured on the course\'s completion requirements','100% only'], correct:2}

function flattenLessons(course){
  const out = [];
  course.curriculum.forEach(function(m){ m.lessons.forEach(function(l){ out.push(Object.assign({module:m.module}, l)); }); });
  return out;
}
const CourseProgress = {
  state: function(enrollmentId, lessonId){
    const map = DB.lessonProgress[enrollmentId] || {};
    return map[lessonId] || 'locked';
  },
  recompute: function(enrollmentId){
    const en = Q.enrollment(enrollmentId);
    const course = Q.course(en.courseId);
    const lessons = flattenLessons(course);
    const map = DB.lessonProgress[enrollmentId] || {};
    const done = lessons.filter(function(l){ return map[l.id]==='completed'; }).length;
    en.progressPct = Math.round((done/lessons.length)*100);
  },
  markComplete: function(enrollmentId, lessonId){
    const en = Q.enrollment(enrollmentId);
    const course = Q.course(en.courseId);
    const lessons = flattenLessons(course);
    const map = DB.lessonProgress[enrollmentId] || (DB.lessonProgress[enrollmentId]={});
    map[lessonId] = 'completed';
    const idx = lessons.findIndex(function(l){ return l.id===lessonId; });
    if(idx>-1 && idx+1<lessons.length){
      const nextId = lessons[idx+1].id;
      if(!map[nextId] || map[nextId]==='locked') map[nextId] = 'available';
    }
    CourseProgress.recompute(enrollmentId);
    const allDone = lessons.every(function(l){ return map[l.id]==='completed'; });
    if(allDone){ CertificateEngine.checkAndIssue(enrollmentId); }
  },
  gradeAssessment: function(enrollmentId, lessonId, scorePct, passThreshold){
    const map = DB.lessonProgress[enrollmentId] || (DB.lessonProgress[enrollmentId]={});
    if(scorePct >= passThreshold){
      CourseProgress.markComplete(enrollmentId, lessonId);
      return true;
    } else {
      map[lessonId] = 'failed';
      CourseProgress.recompute(enrollmentId);
      return false;
    }
  }
};
const CertificateEngine = {
  checkAndIssue: function(enrollmentId){
    const en = Q.enrollment(enrollmentId);
    const course = Q.course(en.courseId);
    en.status = 'completed';
    en.completionDate = en.completionDate || new Date().toISOString().slice(0,10);
    en.progressPct = 100;
    if(course.completionRules.adminApproval){
      en.certPending = true;
      DB.auditLog.unshift({id:Util.uid('aud'), date:new Date().toISOString(), actor:'System (Completion Engine)', action:'Awaiting certificate approval', entity:'Enrollment '+en.id+' / Student '+en.studentId, details:'All requirements met for '+course.title+'; administrative approval required before certificate issuance.'});
      DB.notifications.unshift({id:Util.uid('nt'), studentId:en.studentId, title:'Course complete — certificate pending review', body:'You met every requirement for '+course.title+'. An administrator will review and issue your certificate shortly.', date:new Date().toISOString().slice(0,10), read:false, type:'certificate'});
      return null;
    }
    return CertificateEngine.issue(en);
  },
  issue: function(en){
    const course = Q.course(en.courseId);
    const student = Q.student(en.studentId);
    const certNumber = 'TE-'+new Date().getFullYear()+'-'+String(Math.floor(100000+Math.random()*899999));
    const cert = {id:Util.uid('cert'), certNumber:certNumber, studentId:student.id, courseId:course.id, completionDate:en.completionDate, creditHours:course.creditHours, licenseType:course.certificateLicenseType, instructorId:course.instructorId, providerNumber:'DEMO-PROVIDER-0001', verificationStatus:'verified', verificationUrl:'', revoked:false, issuedAt:new Date().toISOString().slice(0,10), replacementOf:null};
    DB.certificates.push(cert);
    const deadline = new Date(en.completionDate); deadline.setFullYear(deadline.getFullYear()+2);
    DB.ceLedger.push({id:Util.uid('ceh'), studentId:student.id, courseId:course.id, creditHours:course.creditHours, profession:course.profession, earnedDate:en.completionDate, licenseCycleDeadline:deadline.toISOString().slice(0,10)});
    DB.notifications.unshift({id:Util.uid('nt'), studentId:student.id, title:'Certificate ready', body:'Your certificate for '+course.title+' is ready to download.', date:new Date().toISOString().slice(0,10), read:false, type:'certificate'});
    DB.communications.unshift({id:Util.uid('comm'), studentId:student.id, template:'Certificate Issued', subject:'Your certificate is ready: '+course.title, date:new Date().toISOString().slice(0,10), channel:'email'});
    DB.auditLog.unshift({id:Util.uid('aud'), date:new Date().toISOString(), actor:'System (Completion Engine)', action:'Certificate issued', entity:'Certificate '+cert.id+' / Student '+student.id, details:'Course: '+course.title});
    en.certPending = false;
    return cert;
  }
};

function renderOutlineNav(course, en, activeLessonId){
  const map = DB.lessonProgress[en.id] || {};

            ('<span class="outline-lesson" style="opacity:.55;cursor:not-allowed;" aria-disabled="true"><span class="lesson-state '+st+'" aria-hidden="true">'+icon+'</span>'+l.title+'<span class="sr-only"> — locked</span></span>');
        }).join('')+

function renderCompletionChecklist(course, en, map){
  const r = course.completionRules;
  const lessons = flattenLessons(course);
  const allLessonsDone = lessons.every(function(l){ return map[l.id]==='completed'; });
  const rows = [];
  if(r.allLessons) rows.push(['All required lessons completed', allLessonsDone]);
  if(r.finalPassScore) rows.push(['Final assessment passed ('+r.finalPassScore+'%+)', lessons.some(function(l){ return l.type==='final' && map[l.id]==='completed'; })]);
  if(r.assignmentApproval) rows.push(['Assignment approved by instructor', DB.submissions.some(function(s){ return s.studentId===en.studentId && DB.assignments.find(function(a){return a.id===s.assignmentId;}) && DB.assignments.find(function(a){return a.id===s.assignmentId;}).courseId===course.id && s.status==='graded' && s.grade==='Pass'; })]);
  if(r.evaluation) rows.push(['Course evaluation submitted', lessons.some(function(l){ return l.type==='evaluation' && map[l.id]==='completed'; })]);
  if(r.adminApproval) rows.push(['Administrative approval', !en.certPending && en.status==='completed']);
  return '<ul style="list-style:none;padding:0;">'+rows.map(function(r){ return '<li style="margin-bottom:6px;">'+(r[1]?'<span class="pill pill-success">&#10003; Done</span>':'<span class="pill pill-neutral">&#9675; Not yet</span>')+' '+r[0]+'</li>'; }).join('')+'</ul>';
}

  if(en.certPending) return '<div class="banner banner-warn"><span aria-hidden="true">&#8987;</span><span>All requirements met — awaiting administrative approval before your certificate is issued.</span></div>';
  if(allDone) return '<div class="banner banner-info"><span aria-hidden="true">&#8987;</span><span>Finishing up certificate processing…</span></div>';
  return '<p class="small muted mb-0">Complete every item in the checklist above to unlock your certificate.</p>';
}

Renderers.lesson = function(params){

  return '<div class="page-head"><div><p class="muted small mb-0">'+lesson.module+'</p><h1>'+lesson.title+'</h1></div>'+

        '<div class="flex justify-between mt-md">'+

      '</div>'+

function renderLessonBody(en, course, lesson, st){
  if(st==='completed'){
    var doneBanner = '<div class="banner banner-success"><span aria-hidden="true">&#10003;</span><span>Completed.</span></div>';
  }
  if(lesson.type==='video' || lesson.type==='live'){
    return (st==='completed'?doneBanner:'')+
      '<div style="background:var(--navy);color:#fff;border-radius:10px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;margin-bottom:14px;"><span>&#9658; '+(lesson.type==='live'?'Live session':'Video')+' — '+lesson.duration+' (demo placeholder)</span></div>'+
      (st!=='completed' ? '<div class="checkbox-row field"><input type="checkbox" id="watched-'+lesson.id+'" data-onchange="noop"><label for="watched-'+lesson.id+'" style="margin:0;">I have watched this in full</label></div><button class="btn btn-primary" data-action="completeLesson" data-en="'+en.id+'" data-lesson="'+lesson.id+'">Mark Complete</button>' : '<button class="btn btn-outline btn-sm" disabled>Already completed</button>');
  }
  if(lesson.type==='reading'){
    return (st==='completed'?doneBanner:'')+
      '<div class="card" style="background:var(--gray-50);"><p>This reading covers key concepts for "'+lesson.title+'." (Demonstration placeholder text — in production this renders the real lesson content, PDFs, and embedded media.)</p></div>'+
      (st!=='completed' ? '<button class="btn btn-primary mt-sm" data-action="completeLesson" data-en="'+en.id+'" data-lesson="'+lesson.id+'">Mark Complete</button>' : '<button class="btn btn-outline btn-sm mt-sm" disabled>Already completed</button>');
  }
  if(lesson.type==='assignment'){
    const assignment = DB.assignments.find(function(a){ return a.courseId===course.id; });
    const sub = assignment ? DB.submissions.find(function(s){ return s.assignmentId===assignment.id && s.studentId===en.studentId; }) : null;
    return renderAssignmentBlock(en, course, assignment, sub, lesson.id);
  }
  if(lesson.type==='quiz' || lesson.type==='final'){
    return renderAssessmentBlock(en, course, lesson, st);
  }
  if(lesson.type==='evaluation'){
    return (st==='completed'?doneBanner:'')+
      '<p class="small">Please rate this course before finishing.</p>'+
      (st!=='completed' ? ('<div class="field"><label for="eval-rating">Overall rating</label><select id="eval-rating"><option>5 — Excellent</option><option>4 — Good</option><option>3 — Average</option></select></div><button class="btn btn-primary" data-action="completeLesson" data-en="'+en.id+'" data-lesson="'+lesson.id+'">Submit Evaluation</button>') : '<button class="btn btn-outline btn-sm" disabled>Submitted</button>');
  }
  return '<p>Lesson content placeholder.</p>';
}
function renderAssignmentBlock(en, course, assignment, sub, lessonId){
  if(!assignment) return '<p class="small muted">No assignment configured for this course in the demo.</p>';
  if(sub){
    return '<div class="banner '+(sub.status==='graded'?'banner-success':'banner-info')+'"><span aria-hidden="true">'+(sub.status==='graded'?'&#10003;':'&#8593;')+'</span><span>'+(sub.status==='graded' ? ('Graded: '+sub.grade+(sub.feedback?(' — "'+sub.feedback+'"'):'')) : 'Submitted — awaiting instructor review.')+'</span></div>'+
    (sub.status==='graded' && sub.grade==='Pass' && DB.lessonProgress[en.id][lessonId]!=='completed' ? ('<button class="btn btn-primary mt-sm" data-action="completeLesson" data-en="'+en.id+'" data-lesson="'+lessonId+'">Continue</button>') : '');
  }
  return '<h4>'+assignment.title+'</h4><p class="small">'+assignment.description+'</p><p class="small muted">Due '+Util.fmtDate(assignment.dueDate)+'</p>'+
    '<form data-action="submitAssignment" data-assignment="'+assignment.id+'" data-lesson="'+lessonId+'" data-en="'+en.id+'">'+
    '<div class="field"><label for="assign-text">Your response</label><textarea id="assign-text" name="content" placeholder="Type your written response…"></textarea></div>'+
    '<button class="btn btn-primary" type="submit">Submit Assignment</button></form>';
}
function renderAssessmentBlock(en, course, lesson, st){
  const threshold = lesson.type==='final' ? course.completionRules.finalPassScore : course.completionRules.minQuizScore;
  const n = lesson.type==='final' ? 5 : 3;
  const questions = QUIZ_BANK.slice(0,n);
  if(st==='completed') return '<div class="banner banner-success"><span aria-hidden="true">&#10003;</span><span>Passed with a score meeting the required '+threshold+'%.</span></div><button class="btn btn-outline btn-sm" disabled>Completed</button>';
  const failedBanner = st==='failed' ? '<div class="banner banner-danger"><span aria-hidden="true">&#9888;</span><span>Your last attempt did not meet the required '+threshold+'%. Review the material and try again.</span></div>' : '';
  return failedBanner+'<form data-action="submitAssessment" data-en="'+en.id+'" data-lesson="'+lesson.id+'" data-threshold="'+threshold+'">'+
    questions.map(function(q,i){
      return '<fieldset><legend>Question '+(i+1)+'</legend><p class="small">'+q.q+'</p>'+
        q.options.map(function(opt,oi){ return '<label class="checkbox-row" style="margin-bottom:6px;"><input type="radio" name="q'+i+'" value="'+oi+'" required> <span>'+opt+'</span></label>'; }).join('')+
      '</fieldset>';
    }).join('')+
    '<button class="btn btn-primary" type="submit">Submit '+(lesson.type==='final'?'Final Assessment':'Knowledge Check')+'</button></form>';
}
Object.assign(Actions,{
  noop: function(){},
  completeLesson: function(el){
    const enId = el.getAttribute('data-en'), lessonId = el.getAttribute('data-lesson');
    CourseProgress.markComplete(enId, lessonId);

  submitAssignment: function(form){

    const assignmentId = form.getAttribute('data-assignment'), lessonId = form.getAttribute('data-lesson'), enId = form.getAttribute('data-en');
    const en = Q.enrollment(enId);
    DB.submissions.push({id:Util.uid('sub'), assignmentId:assignmentId, studentId:en.studentId, status:'submitted', submittedAt:new Date().toISOString().slice(0,10), content:form.content.value, grade:null, feedback:null});
    DB.auditLog.unshift({id:Util.uid('aud'), date:new Date().toISOString(), actor:Q.studentName(en.studentId), action:'Assignment submitted', entity:'Assignment '+assignmentId, details:''});
    Toast.show('success','Assignment submitted','Your instructor will review it soon.');
    render();
  },
  submitAssessment: function(form){
    const enId = form.getAttribute('data-en'), lessonId = form.getAttribute('data-lesson'), threshold = Number(form.getAttribute('data-threshold'));
    const n = QUIZ_BANK.length >= 5 ? (form.querySelectorAll('fieldset').length) : 3;
    let correct = 0, answered = 0;
    for(let i=0;i<n;i++){
      const picked = form.querySelector('input[name="q'+i+'"]:checked');
      if(picked){ answered++; if(Number(picked.value)===QUIZ_BANK[i].correct) correct++; }
    }
    if(answered < n){ Toast.show('error','Answer every question','Please select an answer for each question before submitting.'); return; }
    const score = Math.round((correct/n)*100);
    const passed = CourseProgress.gradeAssessment(enId, lessonId, score, threshold);
    Toast.show(passed?'success':'error', passed?('Passed — scored '+score+'%'):('Scored '+score+'% — needed '+threshold+'%'), passed?'Great work — your progress has been updated.':'Review the lesson material and try again.');
    render();
  }
});

/* =====================================================================
   SECTION: COMMUNITY ENGINE
   Distinguishes three concepts per spec: an academic COHORT (learning/
   scheduling grouping), a COMMUNITY (social/discussion grouping), and a
   MEMBERSHIP/ACCESS PLAN (the commercial entitlement — represented here
   by the enrollment's status/accessExpiresAt). Community membership is
   always derived live from enrollment state, never stored separately.
   ===================================================================== */
function communityAccessFor(studentId, communityId){
  const community = Q.community(communityId);
  if(!community) return {level:'none', reason:'Community not found.'};
  if(community.type==='alumni'){
    const hasCompleted = DB.enrollments.some(function(e){ return e.studentId===studentId && e.status==='completed'; });
    return hasCompleted ? {level:'full'} : {level:'none', reason:'The Alumni Network is available after you complete your first course.'};
  }
  const course = Q.course(community.courseId);
  const en = DB.enrollments.find(function(e){ return e.studentId===studentId && e.courseId===course.id; });
  if(!en) return {level:'none', reason:'You are not enrolled in this course.'};
  if(en.status==='active' || en.status==='completed') return {level:'full'};
  if(en.status==='expired'){
    const rule = course.communityRule;
    if(rule.onExpire==='expire') return {level:'none', reason:'Community access ended when your course access expired.'};
    if(rule.onExpire==='alumni') return {level:'redirect-alumni', reason:'This course community has closed. You\'ve been moved to the Alumni Network.'};
    if(rule.onExpire==='read-only') return {level:'read-only', reason:'Your course access has ended. This community is now read-only.'};
    if(rule.onExpire==='grace'){
      const daysSince = -Util.daysUntil(en.accessExpiresAt);
      return daysSince <= rule.graceDays ? {level:'full', reason:'Grace period active ('+(rule.graceDays-daysSince)+' days left).'} : {level:'read-only', reason:'Your grace period has ended. This community is now read-only.'};
    }
  }
  return {level:'read-only'};
}

    const role = STATE.session.role==='student' ? 'Student' : (ROLE_DEFS[STATE.session.role]||{}).label || 'Staff';

function monthlyEnrollmentTrend(){
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key:d.getFullYear()+'-'+d.getMonth(), label:d.toLocaleDateString('en-US',{month:'short'}), count:0});
  }
  DB.enrollments.forEach(function(e){
    const d = new Date(e.enrolledAt);
    const key = d.getFullYear()+'-'+d.getMonth();
    const bucket = months.find(function(m){ return m.key===key; });
    if(bucket) bucket.count++;
  });
  return months;
}
function renderAdminDashboard(){
  const activeStudents = DB.students.filter(function(s){ return s.status==='active'; }).length;
  const recentEnrollments = DB.enrollments.filter(function(e){ return Util.daysUntil(e.enrolledAt) > -14; }).length;
  const ceCreditsIssued = DB.ceLedger.reduce(function(a,c){ return a+c.creditHours; },0);
  const completionRate = DB.enrollments.length ? Math.round((DB.enrollments.filter(function(e){ return e.status==='completed'; }).length/DB.enrollments.length)*100) : 0;

  const attentionStudents = DB.students.filter(function(s){ return s.riskFlag; }).map(function(s){ return {student:s, reasons:riskReasons(s, Q.enrollmentsForStudent(s.id))}; });
  const upcomingClasses = DB.cohorts.filter(function(c){ return c.deliveryMethod!=='self-paced' && Util.daysUntil(c.startDate)>=0; }).sort(function(a,b){ return new Date(a.startDate)-new Date(b.startDate); }).slice(0,5);
  const pendingCerts = DB.enrollments.filter(function(e){ return e.certPending; });
  const trend = monthlyEnrollmentTrend();
  const trendMax = Math.max(1, Math.max.apply(null, trend.map(function(m){ return m.count; })));

  return '<div class="page-head"><div><h1 class="mb-0">Admin Dashboard</h1><p class="muted mb-0">A daily operational snapshot for TEAM EDU staff.</p></div></div>'+

  '<div class="grid grid-4">'+
    adminCard('Active Students', activeStudents, 'students')+
    adminCard('New Enrollments (14d)', recentEnrollments, 'enrollments')+
    adminCard('CE Credits Issued', ceCreditsIssued, 'credits')+
    adminCard('Completion Rate', completionRate+'%', 'enrollments')+
  '</div>'+

  '<div class="grid" style="grid-template-columns:1.5fr 1fr;margin-top:20px;align-items:start;">'+
  '<div>'+
    (can('students') ? ('<div class="card"><h3>Students Requiring Attention</h3>'+
      (attentionStudents.length ? DataTable({columns:[{key:'name',label:'Student'},{key:'status',label:'Status'},{key:'reason',label:'Why'},{key:'action',label:''}], rows:attentionStudents, renderCell:function(c,r){
        if(c.key==='name') return r.student.firstName+' '+r.student.lastName;
        if(c.key==='status') return StatusPill(r.student.status);
        if(c.key==='reason') return r.reasons.length ? r.reasons.join('; ') : 'Flagged for staff review';
        if(c.key==='action') return '<a class="link-btn" href="#/students/'+r.student.id+'">View Record</a>';
      }}) : EmptyState('No students currently flagged at risk.'))+
    '</div>') : '')+
    (can('certificates') ? ('<div class="card mt-md"><h3>Pending Certificates</h3>'+

  },

    if(!guardWrite())return;
    const keepId = el.getAttribute('data-keep'), dropId = el.getAttribute('data-drop');
    Modal.confirm('Merge these two records?', 'This moves all enrollments, payments, certificates, and history onto the kept record and permanently removes the duplicate. This cannot be undone in this demo session (Reset Demo Data will restore both).', 'Merge Records', function(){
      mergeStudentRecords(keepId, dropId);

function renderDupPairRow(a,b){
  return '<div class="card" style="margin-bottom:10px;"><div class="flex justify-between items-center" style="flex-wrap:wrap;gap:10px;">'+
    '<div><strong>'+a.firstName+' '+a.lastName+'</strong> ('+a.id+') &middot; '+a.email+'<br class="small">'+
    '<strong>'+b.firstName+' '+b.lastName+'</strong> ('+b.id+') &middot; '+b.email+'</div>'+
    '<div>'+guardedActionButtons([{label:'Compare & Merge', action:'compareStudents', id:''}]).replace('data-id=""','data-a="'+a.id+'" data-b="'+b.id+'"')+'</div>'+
  '</div></div>';

function compareCol(s){
  return '<div class="card"><h4>'+s.firstName+' '+s.lastName+' ('+s.id+')</h4><div class="kv"><dt>Email</dt><dd>'+s.email+'</dd><dt>Phone</dt><dd>'+s.phone+'</dd><dt>Status</dt><dd>'+s.status+'</dd><dt>License</dt><dd>'+s.licenseType+'</dd><dt>Created</dt><dd>'+Util.fmtDate(s.createdAt)+'</dd><dt>Enrollments</dt><dd>'+Q.enrollmentsForStudent(s.id).length+'</dd><dt>Payments</dt><dd>'+Q.transactionsForStudent(s.id).length+'</dd></div></div>';
}
function mergeStudentRecords(keepId, dropId){
  DB.enrollments.forEach(function(e){ if(e.studentId===dropId) e.studentId=keepId; });
  DB.transactions.forEach(function(t){ if(t.studentId===dropId) t.studentId=keepId; });
  DB.certificates.forEach(function(c){ if(c.studentId===dropId) c.studentId=keepId; });
  DB.ceLedger.forEach(function(c){ if(c.studentId===dropId) c.studentId=keepId; });
  DB.communications.forEach(function(c){ if(c.studentId===dropId) c.studentId=keepId; });
  DB.documents.forEach(function(d){ if(d.studentId===dropId) d.studentId=keepId; });
  DB.supportCases.forEach(function(c){ if(c.studentId===dropId) c.studentId=keepId; });
  DB.submissions.forEach(function(s){ if(s.studentId===dropId) s.studentId=keepId; });
  DB.studentNotes.forEach(function(n){ if(n.studentId===dropId) n.studentId=keepId; });
  DB.applications.forEach(function(a){ if(a.studentId===dropId) a.studentId=keepId; });
  DB.attendanceSessions.forEach(function(sess){ if(sess.records[dropId]!==undefined){ sess.records[keepId]=sess.records[dropId]; delete sess.records[dropId]; } });
  DB.students = DB.students.filter(function(s){ return s.id!==dropId; });
  DB.auditLog.unshift({id:Util.uid('aud'), date:new Date().toISOString(), actor:STATE.session.name, action:'Student records merged', entity:'Student '+keepId, details:'Merged duplicate record '+dropId+' into '+keepId+'.'});
}

function riskReasons(s, ens){
  const reasons = [];
  ens.forEach(function(e){ if(e.status==='active' && Util.daysUntil(e.accessExpiresAt)<=14 && Util.daysUntil(e.accessExpiresAt)>=0) reasons.push('Access expiring soon for '+Q.courseName(e.courseId)); });
  if(Q.transactionsForStudent(s.id).some(function(t){ return t.status==='failed'; })) reasons.push('Has a failed payment');
  if(ens.some(function(e){ return e.status==='active' && e.progressPct<20 && Util.daysUntil(e.enrolledAt)<-30; })) reasons.push('Low progress after 30+ days enrolled');
  return reasons;
}

  '<div class="grid grid-2 mt-md">'+

Renderers['course-builder'] = function(params){
  const id = params[0];
  let draft;
  if(id === 'new'){
    draft = newDraft();
    const draftId = Util.uid('draft');
    STATE.courseBuilderDrafts[draftId] = draft;
    navigate('course-builder/'+draftId);
    return '<p class="muted">Preparing course builder…</p>';
  }
  if(STATE.courseBuilderDrafts[id]){
    draft = STATE.courseBuilderDrafts[id];
  } else if(Q.course(id)){
    const c = Q.course(id);
    draft = { step:1, courseId:c.id, data: Object.assign({}, c, {rules:c.completionRules, communityOnExpire:c.communityRule.onExpire, communityGraceDays:c.communityRule.graceDays, communityFeatures:{discussions:true,events:true,resources:true}, automations:['Enrollment Confirmed','Payment Receipt','Certificate Issued']}) };
    STATE.courseBuilderDrafts[id] = draft;
  } else {
    return EmptyState('Course draft not found.');
  }
  const stepIdx = draft.step;
  return '<div class="page-head"><div><p class="muted small mb-0">Course Builder</p><h1>'+(draft.data.title||'New Course')+'</h1></div>'+
    '<div>'+(isReadOnly()?'':('<button class="btn btn-ghost btn-sm" data-action="saveDraft" data-draft="'+id+'">Save Draft</button> '))+'</div></div>'+
  '<div class="tabs" role="tablist" style="flex-wrap:wrap;">'+COURSE_BUILDER_STEPS.map(function(label,i){ return '<button class="tab-btn" role="tab" aria-selected="'+(i+1===stepIdx)+'" data-action="gotoBuilderStep" data-draft="'+id+'" data-step="'+(i+1)+'">'+(i+1)+'. '+label+'</button>'; }).join('')+'</div>'+
  '<div class="card">'+renderBuilderStep(draft, id, stepIdx)+'</div>'+
  '<div class="flex justify-between mt-md">'+
    (stepIdx>1?('<button class="btn btn-ghost" data-action="gotoBuilderStep" data-draft="'+id+'" data-step="'+(stepIdx-1)+'">&larr; Previous</button>'):'<span></span>')+
    (stepIdx<COURSE_BUILDER_STEPS.length?('<button class="btn btn-primary" data-action="gotoBuilderStep" data-draft="'+id+'" data-step="'+(stepIdx+1)+'">Next &rarr;</button>'):'<span></span>')+
  '</div>';
};
function field(label, id, html){ return '<div class="field"><label for="'+id+'">'+label+'</label>'+html+'</div>'; }
function bInput(draft,id,key,type){ return '<input id="'+id+'" type="'+(type||'text')+'" value="'+Util.escapeHtml(draft.data[key]==null?'':draft.data[key])+'" data-oninput="builderField" data-field="'+key+'">'; }

    '<div class="grid grid-2">'+field('Profession','b-prof', '<select id="b-prof" data-onchange="builderField" data-field="profession">'+['Real Estate','Insurance','Mortgage'].map(function(p){return '<option '+(d.profession===p?'selected':'')+'>'+p+'</option>';}).join('')+'</select>')+

    field('Description','b-desc', '<textarea id="b-desc" data-oninput="builderField" data-field="description">'+Util.escapeHtml(d.description)+'</textarea>')+
    field('Estimated duration','b-dur', bInput(draft,'b-dur','duration'));

  if(step===5){

    return ['allLessons:All required lessons completed','videoCompletion:Required video completion','assignmentApproval:Required assignment approval','acknowledgement:Required acknowledgement','evaluation:Course evaluation required','adminApproval:Require administrative approval before certificate issuance'].map(function(pair){
      const parts = pair.split(':'); const key=parts[0], label=parts[1];

    '<div class="grid grid-2">'+field('Start date','b-start', bInput(draft,'b-start','startDate','date'))+field('End date','b-end', bInput(draft,'b-end','endDate','date'))+'</div>'+
    '<div class="grid grid-2">'+field('Capacity','b-cap', bInput(draft,'b-cap','capacity','number'))+field('Location (if in-person)','b-loc', bInput(draft,'b-loc','location'))+'</div>'+
    field('Virtual meeting link (if applicable)','b-link', bInput(draft,'b-link','meetingLink'));
  if(step===7) return field('Price (USD)','b-price', bInput(draft,'b-price','price','number'))+
    '<label class="checkbox-row field"><input type="checkbox" data-onchange="builderField" data-field="hasCommunity" data-checkbox="1" '+(d.hasCommunity?'checked':'')+'> Include a private community with this course</label>'+
    '<label class="checkbox-row field"><input type="checkbox" data-onchange="builderField" data-field="paymentPlanEnabled" data-checkbox="1" '+(d.paymentPlanEnabled?'checked':'')+'> Offer a payment plan</label>'+
    (d.paymentPlanEnabled ? field('Number of installments','b-installments', bInput(draft,'b-installments','planInstallments','number')) : '')+
    field('Refund policy','b-refund', '<textarea id="b-refund" data-oninput="builderField" data-field="refundPolicy">'+Util.escapeHtml(d.refundPolicy)+'</textarea>');
  if(step===8) return field('When course access expires, community access should:', 'b-onexpire', '<select id="b-onexpire" data-onchange="builderField" data-field="communityOnExpire">'+[['expire','End immediately'],['read-only','Convert to read-only'],['grace','Continue for a grace period'],['alumni','Move student to Alumni community']].map(function(o){ return '<option value="'+o[0]+'" '+(d.communityOnExpire===o[0]?'selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select>')+
