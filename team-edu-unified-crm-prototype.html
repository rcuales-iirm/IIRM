  builderModuleField: function(el){ currentBuilderDraft().data.curriculum[Number(el.getAttribute('data-mi'))].module = el.value; render(); },
  builderLessonField: function(el){ const d=currentBuilderDraft().data; d.curriculum[Number(el.getAttribute('data-mi'))].lessons[Number(el.getAttribute('data-li'))][el.getAttribute('data-lkey')] = el.value; render(); },
  addModule: function(){ currentBuilderDraft().data.curriculum.push({module:'New Module', lessons:[{id:Util.uid('l'), title:'New Lesson', type:'reading', duration:'10 min'}]}); render(); },
  removeModule: function(el){ currentBuilderDraft().data.curriculum.splice(Number(el.getAttribute('data-mi')),1); render(); },
  addLesson: function(el){ currentBuilderDraft().data.curriculum[Number(el.getAttribute('data-mi'))].lessons.push({id:Util.uid('l'), title:'New Lesson', type:'reading', duration:'10 min'}); render(); },
  removeLesson: function(el){ currentBuilderDraft().data.curriculum[Number(el.getAttribute('data-mi'))].lessons.splice(Number(el.getAttribute('data-li')),1); render(); },
  saveDraft: function(el){ Toast.show('success','Draft saved','You can return to finish this course later in this session.'); },
  publishCourse: function(el){
    if(!guardWrite())return;
    const draft = currentBuilderDraft();
    if(!draft.data.title){ Toast.show('error','Missing title','Add a course title in Step 1 before publishing.'); return; }
    const d = draft.data;
    const courseId = draft.courseId || Util.uid('c');
    const communityId = 'com-'+courseId;
    const course = {
      id:courseId, title:d.title, profession:d.profession, category:d.category||'General', creditHours:Number(d.creditHours)||1, price:Number(d.price)||0,
      deliveryMethod:d.deliveryMethod, status:'published', instructorId: (Q.course(courseId)||{}).instructorId || 'i1', duration:d.duration||'—', hasCommunity:d.hasCommunity, communityId:communityId,
      description:d.description||'', objectives:['Meet Florida CE requirements for this topic'], prerequisites:d.prerequisites||'None',
      curriculum:d.curriculum, completionRules:Object.assign({}, d.rules, {minQuizScore:Number(d.minQuizScore), finalPassScore:Number(d.finalPassScore)}),
      certificateLicenseType:d.certificateLicenseType, refundPolicy:d.refundPolicy, communityRule:{onExpire:d.communityOnExpire, graceDays:Number(d.communityGraceDays)||0}
    };
    const existingIdx = DB.courses.findIndex(function(c){ return c.id===courseId; });
    if(existingIdx>-1) DB.courses[existingIdx] = course; else DB.courses.push(course);
    if(!DB.communities.find(function(c){return c.id===communityId;})) DB.communities.push({id:communityId, name:d.title+' — Community', type:'course', courseId:courseId});
    if(d.paymentPlanEnabled && !DB.paymentPlans.find(function(p){return p.courseId===courseId;})){
      DB.paymentPlans.push({id:Util.uid('pp'), courseId:courseId, installments:Number(d.planInstallments)||2, amountPerInstallment: Math.round((course.price/(Number(d.planInstallments)||2))*100)/100, label:(Number(d.planInstallments)||2)+' payments of '+Util.fmtMoney(Math.round((course.price/(Number(d.planInstallments)||2))*100)/100)});
    }
    if(d.startDate && !DB.cohorts.find(function(c){return c.courseId===courseId;})){
      DB.cohorts.push({id:Util.uid('ch'), courseId:courseId, name:d.title+' — Section 1', deliveryMethod:d.deliveryMethod, startDate:d.startDate, endDate:d.endDate||d.startDate, capacity:Number(d.capacity)||50, instructorId:course.instructorId, location:d.location||null, meetingLink:d.meetingLink||null, communityId:communityId, status:'open'});
    }
    DB.auditLog.unshift({id:Util.uid('aud'), date:new Date().toISOString(), actor:STATE.session.name, action:'Course published', entity:'Course '+courseId, details:course.title});
    Toast.show('success','Course published', course.title+' is now live in the catalog.');
    navigate('courses');
  }
});
function currentBuilderDraft(){
  const hash = window.location.hash;
  const m = hash.match(/course-builder\/([^\/]+)/);
  return m ? STATE.courseBuilderDrafts[m[1]] : null;
}

Renderers.assessments = function(){
  const rows = [];
  DB.courses.forEach(function(course){
    flattenLessons(course).filter(function(l){ return l.type==='quiz'||l.type==='final'; }).forEach(function(l){
      let passed=0, failed=0;
      DB.enrollments.filter(function(e){ return e.courseId===course.id; }).forEach(function(e){
        const st = (DB.lessonProgress[e.id]||{})[l.id];
        if(st==='completed') passed++; if(st==='failed') failed++;
      });
      rows.push({course:course.title, title:l.title, type:l.type, threshold: l.type==='final'?course.completionRules.finalPassScore:course.completionRules.minQuizScore, passed:passed, failed:failed});
    });
  });
  return '<div class="page-head"><h1>Assessments</h1></div>'+
  DataTable({columns:[{key:'course',label:'Course'},{key:'title',label:'Assessment'},{key:'type',label:'Type'},{key:'threshold',label:'Pass Threshold'},{key:'passed',label:'Passed'},{key:'failed',label:'Failed'}], rows:rows, emptyMessage:'No assessments configured.', renderCell:function(c,r){
    if(c.key==='course') return r.course; if(c.key==='title') return r.title; if(c.key==='type') return r.type==='final'?'Final':'Knowledge Check'; if(c.key==='threshold') return r.threshold+'%'; if(c.key==='passed') return r.passed; if(c.key==='failed') return r.failed;
  }});
};

      '<div class="field"><label for="res-note">Resolution note</label><textarea id="res-note" name="note"></textarea></div>'+
      '</div><div class="modal-footer"><button type="button" class="btn btn-ghost" data-action="closeModal">Cancel</button><button type="submit" class="btn btn-primary">Save Resolution</button></div></form>', {label:'Record Resolution'});
  },
  saveResolution: function(form){
    if(!guardWrite())return;
    if(!validateRequired(form,['note'])) return;
    const tx = DB.transactions.find(function(t){ return t.id===form.getAttribute('data-tx'); });
    const outcome = form.outcome.value;
    tx.notes = (tx.notes?tx.notes+' | ':'') + 'Resolution ('+outcome+'): '+form.note.value;
    if(outcome==='retried'){ tx.status='succeeded'; }
    DB.auditLog.unshift({id:Util.uid('aud'), date:new Date().toISOString(), actor:STATE.session.name, action:'Failed payment resolution recorded', entity:'Transaction '+tx.id, details:outcome});
    Modal.close(); Toast.show('success','Resolution recorded',''); render();
  },
  openRefundModal: function(el){
    const tx = DB.transactions.find(function(t){ return t.id===el.getAttribute('data-id'); });
    Modal.open('<div class="modal-header"><h3 style="margin:0">Refund Transaction</h3><button class="icon-btn" data-action="closeModal" aria-label="Close">&times;</button></div>'+
      '<form data-action="saveRefund" data-tx="'+tx.id+'"><div class="modal-body">'+
      '<p class="small muted">'+Q.studentName(tx.studentId)+' — '+Q.courseName(tx.courseId)+'</p>'+

  },

    const amount = Number(form.amount.value);
    tx.status='refunded';
    DB.refunds.unshift({id:Util.uid('rf'), transactionId:tx.id, studentId:tx.studentId, courseId:tx.courseId, amount:amount, reason:form.reason.value, processedBy:STATE.session.staffId||'staff', date:new Date().toISOString().slice(0,10), status:'completed'});
    if(form.revokeAccess.checked){
      const en = DB.enrollments.find(function(e){ return e.studentId===tx.studentId && e.courseId===tx.courseId; });
      if(en) en.status='withdrawn';
    }
    DB.communications.unshift({id:Util.uid('comm'), studentId:tx.studentId, template:'Refund Processed', subject:'Your refund has been processed', date:new Date().toISOString().slice(0,10), channel:'email'});
    DB.auditLog.unshift({id:Util.uid('aud'), date:new Date().toISOString(), actor:STATE.session.name, action:'Refund processed', entity:'Transaction '+tx.id, details:Util.fmtMoney(amount)});
    Modal.close(); Toast.show('success','Refund processed',''); render();
  }
});

Renderers.support = (function(){ const studentSupport = Renderers.support; return function(params){
  if(STATE.session.role==='student') return studentSupport(params);
  const f = STATE.filters.supportAdmin || {};
  let rows = DB.supportCases.slice();

  return '<div class="page-head"><h1>Support Cases</h1></div>'+
  '<div class="table-toolbar"><div class="table-filters"><select data-onchange="setFilter" data-filter-page="supportAdmin" data-filter-key="status"><option value="all">All statuses</option><option value="open" '+(f.status==='open'?'selected':'')+'>Open</option><option value="pending" '+(f.status==='pending'?'selected':'')+'>Pending</option><option value="resolved" '+(f.status==='resolved'?'selected':'')+'>Resolved</option></select></div></div>'+
  DataTable({columns:[{key:'student',label:'Student'},{key:'subject',label:'Subject'},{key:'status',label:'Status'},{key:'priority',label:'Priority'},{key:'action',label:''}], rows:rows, emptyMessage:'No support cases match this filter.', renderCell:function(c,cs){
    if(c.key==='student') return Q.studentName(cs.studentId); if(c.key==='subject') return cs.subject; if(c.key==='status') return StatusPill(cs.status); if(c.key==='priority') return cs.priority;
    if(c.key==='action') return '<button class="link-btn" data-action="viewAdminCase" data-case="'+cs.id+'">Open</button>';
  }})+(STATE.ui.viewingAdminCase ? renderAdminCaseDetail(DB.supportCases.find(function(c){return c.id===STATE.ui.viewingAdminCase;})) : '');
}; })();
function renderAdminCaseDetail(cs){
  if(!cs) return '';
  return '<div class="card mt-md"><h3>'+cs.subject+' '+StatusPill(cs.status)+'</h3><p class="small muted">'+Q.studentName(cs.studentId)+' &middot; assigned to '+(Q.staffMember(cs.assignedTo)?Q.staffMember(cs.assignedTo).name:'—')+'</p>'+
    cs.messages.map(function(m){ return '<div class="reply" style="margin-left:0;"><strong class="small">'+m.author+'</strong> <span class="small muted">'+Util.fmtDate(m.date)+'</span><p class="small mb-0">'+m.content+'</p></div>'; }).join('')+
    (isReadOnly() ? '' : ('<form data-action="addAdminCaseMessage" data-case="'+cs.id+'" class="mt-sm"><textarea name="content" placeholder="Reply to student…" style="min-height:60px;"></textarea><div class="flex gap-sm mt-sm"><button class="btn btn-primary btn-sm" type="submit">Send Reply</button>'+(cs.status!=='resolved'?'<button type="button" class="btn btn-outline btn-sm" data-action="resolveCase" data-case="'+cs.id+'">Mark Resolved</button>':'')+'</div></form>'))+
  '</div>';
}
Object.assign(Actions,{
  viewAdminCase: function(el){ STATE.ui.viewingAdminCase = el.getAttribute('data-case'); render(); },
  addAdminCaseMessage: function(form){
    if(!guardWrite())return; if(!validateRequired(form,['content'])) return;
    const cs = DB.supportCases.find(function(c){ return c.id===form.getAttribute('data-case'); });
    cs.messages.push({author:STATE.session.name, role:ROLE_DEFS[STATE.session.role].label, date:new Date().toISOString().slice(0,10), content:form.content.value});
    if(cs.status==='open') cs.status='pending';
    DB.communications.unshift({id:Util.uid('comm'), studentId:cs.studentId, template:'Support Response', subject:'Re: '+cs.subject, date:new Date().toISOString().slice(0,10), channel:'email'});
    Toast.show('success','Reply sent',''); render();
  },
  resolveCase: function(el){
    if(!guardWrite())return;
    const cs = DB.supportCases.find(function(c){ return c.id===el.getAttribute('data-case'); });
    cs.status='resolved';
    DB.auditLog.unshift({id:Util.uid('aud'), date:new Date().toISOString(), actor:STATE.session.name, action:'Support case resolved', entity:'Support Case '+cs.id, details:cs.subject});
    Toast.show('success','Case resolved',''); render();
  }
});
